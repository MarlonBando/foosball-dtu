# Deployed to ~/app/docker-compose.yml on the Raspberry Pi by .github/workflows/deploy.yml.
# Runtime secrets (SUPABASE_URL, SUPABASE_KEY) are read from ~/app/.env on the Pi,
# which must be created by hand and is never committed.
services:
  backend:
    image: ghcr.io/marlonbando/foosball-dtu:latest
    container_name: foosball-backend
    env_file: .env
    environment:
    - GIN_MODE=release
    ports:
    - "8085:80"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
