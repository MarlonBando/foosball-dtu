name: Build and Deploy Backend to Raspberry Pi

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-pi
  cancel-in-progress: false

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum

    - name: Run tests
      working-directory: backend
      run: go test ./...

  build:
    name: Build arm64 Image
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Lowercase image name
      run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: ./backend
        file: ./backend/Dockerfile
        platforms: linux/arm64
        push: true
        tags: |
          ${{ env.IMAGE }}:latest
          ${{ env.IMAGE }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Raspberry Pi
    needs: build
    runs-on: ubuntu-latest
    environment: pi
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Connect to Tailscale
      uses: tailscale/github-action@v3
      with:
        oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
        tags: tag:ci

    - name: Configure SSH
      env:
        PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "$PI_SSH_KEY" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        cat > ~/.ssh/config <<'CFG'
        Host *
          IdentityFile ~/.ssh/id_ed25519
          StrictHostKeyChecking accept-new
        CFG

    - name: Copy compose file to Pi
      env:
        PI_HOST: ${{ secrets.PI_HOST }}
        PI_USER: ${{ secrets.PI_USER }}
      run: |
        ssh "$PI_USER@$PI_HOST" 'mkdir -p ~/app && cat > ~/app/docker-compose.yml' < deploy/docker-compose.yml

    - name: Pull and restart on Pi
      env:
        PI_HOST: ${{ secrets.PI_HOST }}
        PI_USER: ${{ secrets.PI_USER }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        printf '%s' "$GHCR_TOKEN" | ssh "$PI_USER@$PI_HOST" \
          "docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
          && cd ~/app && docker compose pull && docker compose up -d && docker image prune -f; \
          status=\$?; docker logout ghcr.io; exit \$status"
