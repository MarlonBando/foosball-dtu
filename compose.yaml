services:
  # Backend service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: foosball-backend
    environment:
    - SUPABASE_URL=${SUPABASE_URL}
    - SUPABASE_KEY=${SUPABASE_KEY}
    - GIN_MODE=release
    networks:
    - foosball-network
    restart: unless-stopped

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
    container_name: foosball-frontend
    networks:
    - foosball-network
    restart: unless-stopped

  # Nginx reverse proxy
  proxy:
    image: nginx:alpine
    container_name: foosball-proxy
    ports:
    - "80:80"
    volumes:
    - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro,z
    depends_on:
    - frontend
    - backend
    networks:
    - foosball-network
    restart: unless-stopped

networks:
  foosball-network:
    driver: bridge
