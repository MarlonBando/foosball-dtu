services:
  # Backend service
  foosballdtu-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    environment:
    - SUPABASE_URL=${SUPABASE_URL}
    - SUPABASE_KEY=${SUPABASE_KEY}
    - GIN_MODE=release
    networks:
    - foosball-network
    restart: unless-stopped

  # Frontend service
  foosballdtu-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
    container_name: frontend
    networks:
    - foosball-network
    restart: unless-stopped

  # Nginx reverse proxy
  foosballdtu-proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: proxy
    ports:
    - "80:80"
    depends_on:
    - foosballdtu-backend
    - foosballdtu-frontend
    networks:
    - foosball-network
    restart: unless-stopped

networks:
  foosball-network:
    driver: bridge
